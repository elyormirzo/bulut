<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <!-- fon: markazda juda yengil yorug'lik, chetlarga qarab toza qora -->
    <radialGradient id="bg" cx="0.5" cy="0.44" r="0.62">
      <stop offset="0" stop-color="#1C1C1F"/>
      <stop offset="0.55" stop-color="#0B0B0C"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <!-- belgi: oq -> och kumush (yengil metall tus) -->
    <linearGradient id="glyph" x1="0" y1="180" x2="0" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#F4F4F6"/>
      <stop offset="1" stop-color="#D9D9DE"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <!-- belgi: burilgan E = M -->
    <path d="M 226 426 L 226 268 Q 226 206 288 206 L 352 206 Q 414 206 414 268 L 414 426 M 320 206 L 320 344"
          fill="none" stroke="url(#glyph)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- ovoz to'lqini: chetlarga qarab so'nadi -->
    <g fill="#FFFFFF">
      <rect x="168" y="344" width="20" height="84" rx="10" opacity="0.95"/>
      <rect x="136" y="356" width="20" height="60" rx="10" opacity="0.70"/>
      <rect x="104" y="366" width="20" height="40" rx="10" opacity="0.48"/>
      <rect x="72"  y="374" width="20" height="24" rx="10" opacity="0.28"/>
      <rect x="452" y="344" width="20" height="84" rx="10" opacity="0.95"/>
      <rect x="484" y="356" width="20" height="60" rx="10" opacity="0.70"/>
      <rect x="516" y="366" width="20" height="40" rx="10" opacity="0.48"/>
      <rect x="548" y="374" width="20" height="24" rx="10" opacity="0.28"/>
    </g>
  </g>
</svg>
